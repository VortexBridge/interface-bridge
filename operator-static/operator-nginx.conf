server {
    listen 127.0.0.1:5174;
    server_name 127.0.0.1;
    root /opt/vortex-operator-ui/current/site;

    add_header Content-Security-Policy "default-src 'self'; connect-src http://127.0.0.1:3021; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri /index.html;
    }
}
